<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Métodos de Raíces</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container">

    <h1>Métodos de Raíces</h1>

    <div class="layout">

        <!-- 🔹 PANEL IZQUIERDO -->
        <div class="left-panel">

            <!-- Método -->
            <div class="card">

                <h2>Método</h2>

                <select id="method">

                    <option value="newton">
                        Newton-Raphson
                    </option>

                    <option value="secante">
                        Secante
                    </option>

                    <option value="muller">
                        Müller
                    </option>

                </select>

            </div>

            <!-- Función -->
            <div class="card">

                <h2>Función f(x)</h2>

                <input
                    type="text"
                    id="function"
                    placeholder="Ej: x^3 - x - 2"
                >

            </div>

            <!-- Valores -->
            <div class="card">

                <h2>Valores Iniciales</h2>

                <div class="values-container">

                    <input
                        type="number"
                        id="x0"
                        placeholder="Valor inicial"
                    >

                    <input
                        type="number"
                        id="x1"
                        placeholder="Segundo valor"
                    >

                    <input
                        type="number"
                        id="x2"
                        placeholder="Tercer valor"
                    >

                    <input
                        type="number"
                        id="iterations"
                        placeholder="Número de iteraciones"
                    >

                </div>

            </div>

            <!-- Botón -->
            <button onclick="solve()">

                Resolver

            </button>

        </div>

        <!-- 🔹 PANEL DERECHO -->
        <div class="right-panel">

            <!-- Resultado -->
            <div class="card">

                <h2>Resultado</h2>

                <div id="output">

                    Aquí aparecerá el resultado...

                </div>

            </div>

            <!-- Historial -->
            <div class="card">

                <button
                    class="toggle-btn"
                    onclick="toggleSection('history-container')"
                >

                    Historial

                </button>

                <div
                    id="history-container"
                    class="hidden-section"
                >

                    <div id="history"></div>

                </div>

            </div>

            <!-- Comparación -->
            <div class="card">

                <button
                    class="toggle-btn"
                    onclick="toggleSection('comparison-container')"
                >

                    Comparación de Métodos

                </button>

                <div
                    id="comparison-container"
                    class="hidden-section"
                >

                    <div id="comparison"></div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
